<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Приглашение 🍂</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            background: #2d1b0e;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        #gameScreen {
            width: 100%;
            height: 100%;
            max-width: 450px;
            margin: 0 auto;
            background: linear-gradient(180deg, #4a2818, #2d1b0e, #1a0f08);
            position: relative;
            overflow: hidden;
        }

        .leaf {
            position: absolute;
            font-size: 24px;
            opacity: 0.2;
            animation: fall linear infinite;
            pointer-events: none;
        }
        @keyframes fall {
            0% { transform: translateY(-50px) rotate(0deg); opacity: 0.3; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        /* ЭКРАН 1 */
        #gameScreenContent {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            width: 100%;
            padding: 20px;
            text-align: center;
        }
        .game-title {
            color: #f0d5b0;
            font-size: 20px;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }
        .game-title span {
            display: block;
            font-size: 14px;
            color: #d4a373;
            margin-top: 8px;
        }

        #heart {
            font-size: 120px;
            cursor: pointer;
            filter: drop-shadow(0 0 30px rgba(255, 120, 50, 0.7));
            animation: heartbeat 1.2s ease-in-out infinite;
            margin: 30px 0;
            padding: 20px;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }
        #heart:active {
            animation: none;
            transform: scale(1.3);
        }

        .hint {
            color: #d4a373;
            font-size: 14px;
            margin-top: 15px;
        }

        /* ЭКРАН 2 */
        #inviteScreen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(26, 15, 8, 0.97);
            z-index: 20;
            padding: 25px 20px;
            flex-direction: column;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        #inviteScreen.show {
            display: flex;
        }

        .invite-title {
            font-size: 24px;
            font-weight: 700;
            color: #f0d5b0;
            text-align: center;
        }
        .invite-sub {
            font-size: 14px;
            color: #d4a373;
            text-align: center;
            margin: 5px 0 20px;
        }

        .question-label {
            font-size: 15px;
            font-weight: 600;
            color: #f0d5b0;
            display: block;
            margin: 15px 0 10px;
        }
        .question-label small {
            font-weight: 300;
            color: #b58a6a;
            font-size: 12px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .option-btn {
            background: #3d2415;
            border: 2px solid #6b422a;
            border-radius: 16px;
            padding: 14px 10px;
            color: #d4b59a;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
            font-family: inherit;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            transition: all 0.2s;
            position: relative;
        }
        .option-btn:active {
            transform: scale(0.95);
        }
        .option-btn.selected {
            border-color: #e8a87c;
            background: #5a3220;
            color: #f5e0c0;
        }
        .option-btn.selected::after {
            content: '✓';
            position: absolute;
            top: 6px;
            right: 10px;
            color: #e8a87c;
            font-weight: 700;
            font-size: 16px;
        }
        .option-btn .emoji {
            display: block;
            font-size: 26px;
            margin-bottom: 4px;
        }

        #customInputBlock {
            display: none;
            margin-top: 12px;
        }
        #customInputBlock.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        #customInput {
            width: 100%;
            padding: 14px 16px;
            background: #3d2415;
            border: 2px solid #e8a87c;
            border-radius: 16px;
            color: #f5e0c0;
            font-size: 16px;
            font-family: inherit;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }
        #customInput::placeholder {
            color: #8b6a4a;
        }
        #customInput:focus {
            border-color: #f0c8a0;
            box-shadow: 0 0 20px rgba(232, 168, 124, 0.3);
        }

        .btn-send {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #e8a87c, #c77d4a);
            border: none;
            border-radius: 60px;
            color: #2d1b0e;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 20px;
            font-family: inherit;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-send:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .btn-send:active:not(:disabled) {
            transform: scale(0.95);
        }

        .sending-status {
            color: #f0d5b0;
            font-size: 14px;
            text-align: center;
            margin-top: 10px;
            padding: 10px;
            border-radius: 12px;
            background: #3d2415;
            display: none;
        }
        .sending-status.show { display: block; }
        .sending-status.success { border: 1px solid #8bc34a; color: #c5e1a5; }
        .sending-status.error { border: 1px solid #e91e63; color: #ef9a9a; }

        .error-notice {
            display: none;
            margin-top: 15px;
            padding: 16px 18px;
            background: rgba(233, 30, 99, 0.15);
            border: 2px solid #e91e63;
            border-radius: 16px;
            color: #ffcdd2;
            font-size: 15px;
            line-height: 1.5;
            text-align: center;
            animation: fadeIn 0.4s ease;
        }
        .error-notice.show { display: block; }
        .error-notice b {
            color: #ff8a80;
            display: block;
            margin-bottom: 6px;
            font-size: 16px;
        }

        #finalScreen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            height: 100%;
            padding: 20px;
        }
        #finalScreen.show { display: flex; }
        .final-emoji { font-size: 80px; }
        .final-title {
            font-size: 26px;
            font-weight: 700;
            color: #f0d5b0;
            margin: 10px 0 5px;
        }
        .final-sub { font-size: 16px; color: #d4a373; }
        .final-summary {
            background: #3d2415;
            border-radius: 20px;
            padding: 18px;
            margin: 15px 0;
            width: 100%;
            border: 1px solid #6b422a;
        }
        .final-summary div {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #4a2a1a;
            color: #d4b59a;
            font-size: 15px;
            text-align: left;
            gap: 15px;
        }
        .final-summary div:last-child { border-bottom: none; }
        .final-summary .value { color: #f0d5b0; font-weight: 600; text-align: right; }
        .btn-final {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #c77d4a, #a86438);
            border: none;
            border-radius: 60px;
            color: #f5e0c0;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-final:active { transform: scale(0.95); }
    </style>
</head>
<body>

<div id="gameScreen">
    <div id="leavesContainer"></div>

    <!-- ЭКРАН 1 -->
    <div id="gameScreenContent">
        <div class="game-title">
            🍂 ПОЙМАЙ СЕРДЦЕ
            <span>нажми на него</span>
        </div>
        <div id="heart">❤️</div>
        <div class="hint">👆 Нажми на сердце</div>
    </div>

    <!-- ЭКРАН 2 -->
    <div id="inviteScreen">
        <div class="invite-title">🍁 Ты поймала!</div>
        <div class="invite-sub">Выбери, как мы проведём этот вечер ❤️</div>

        <span class="question-label">📅 Выбери дату</span>
        <div class="options-grid" id="dateOptions">
            <button class="option-btn" data-value="16.09, 18:30"><span class="emoji">🗓️</span>16.09 — 18:30</button>
            <button class="option-btn" data-value="17.09, 18:30"><span class="emoji">🗓️</span>17.09 — 18:30</button>
        </div>

        <span class="question-label">🎯 Что будем делать? <small>(можно несколько)</small></span>
        <div class="options-grid" id="activityOptions">
            <button class="option-btn" data-value="Парк 🍂"><span class="emoji">🍂</span>Парк</button>
            <button class="option-btn" data-value="Кино 🎬"><span class="emoji">🎬</span>Кино</button>
            <button class="option-btn" data-value="Ресторан 🍽️"><span class="emoji">🍽️</span>Ресторан</button>
            <button class="option-btn" data-value="Твоё место 🏙️"><span class="emoji">🏙️</span>Твоё место</button>
            <button class="option-btn" data-value="Боулинг, бильярд, картинг 🎳"><span class="emoji">🎳</span>Боулинг, бильярд, картинг</button>
            <button class="option-btn" data-value="__custom__" id="customOptionBtn"><span class="emoji">✨</span>Что-то своё</button>
        </div>

        <div id="customInputBlock">
            <input type="text" id="customInput" placeholder="Напиши свой вариант..." maxlength="100">
        </div>

        <button class="btn-send" id="sendBtn" disabled>❤️ Отправить ответ</button>
        <div class="sending-status" id="sendingStatus"></div>

        <div class="error-notice" id="errorNotice">
            <b>⚠️ Сообщение не отправлено</b>
            Пожалуйста, напиши мне, что ты выбрала ❤️
        </div>

        <div id="finalScreen">
            <div class="final-emoji">🍂🥰</div>
            <div class="final-title">Договорились!</div>
            <div class="final-sub">Я уже жду этого вечера ❤️</div>
            <div class="final-summary">
                <div><span>📅 Дата</span><span class="value" id="finalDate">—</span></div>
                <div><span>🎯 Досуг</span><span class="value" id="finalActivity">—</span></div>
            </div>
            <button class="btn-final" id="finalBtn">💬 Напишу тебе!</button>
        </div>
    </div>
</div>

<script>
    // ============================================================
    // TELEGRAM
    // ============================================================
    const TELEGRAM_TOKEN = '8672201012:AAE05PBXpbdCP31tR8cAB7YqFo2nObwYMu4';
    const TELEGRAM_CHAT_ID = '435696077';

    // ============================================================
    // ЛИСТЬЯ
    // ============================================================
    const leavesEmojis = ['🍁', '🍂', '🌿', '🍃'];
    const container = document.getElementById('leavesContainer');
    for (let i = 0; i < 20; i++) {
        const leaf = document.createElement('div');
        leaf.className = 'leaf';
        leaf.textContent = leavesEmojis[Math.floor(Math.random() * leavesEmojis.length)];
        leaf.style.left = Math.random() * 100 + '%';
        leaf.style.fontSize = (Math.random() * 20 + 16) + 'px';
        leaf.style.animationDuration = (Math.random() * 10 + 8) + 's';
        leaf.style.animationDelay = (Math.random() * 15) + 's';
        container.appendChild(leaf);
    }

    // ============================================================
    // ПЕРЕХОД НА АНКЕТУ
    // ============================================================
    const heart = document.getElementById('heart');
    const gameScreen = document.getElementById('gameScreenContent');
    const inviteScreen = document.getElementById('inviteScreen');
    let isShown = false;

    function showInvite() {
        if (isShown) return;
        isShown = true;
        inviteScreen.classList.add('show');
        gameScreen.style.display = 'none';
        if (navigator.vibrate) navigator.vibrate(30);
    }

    heart.addEventListener('touchend', function(e) {
        e.preventDefault();
        showInvite();
    }, { passive: false });

    heart.addEventListener('click', function(e) {
        e.preventDefault();
        showInvite();
    });

    setTimeout(showInvite, 3000);

    // ============================================================
    // ВЫБОР ДАТЫ (одна) И ДОСУГА (несколько)
    // ============================================================
    let selectedDate = null;
    let selectedActivities = []; // массив выбранных
    let customActivity = '';

    const dateOptions = document.querySelectorAll('#dateOptions .option-btn');
    const activityOptions = document.querySelectorAll('#activityOptions .option-btn');
    const sendBtn = document.getElementById('sendBtn');
    const customInputBlock = document.getElementById('customInputBlock');
    const customInput = document.getElementById('customInput');
    const errorNotice = document.getElementById('errorNotice');

    // Обновление кнопки "Отправить"
    function updateSendButton() {
        // Проверяем, что дата выбрана и есть хотя бы один вариант досуга
        const hasActivity = selectedActivities.length > 0;
        // Если выбран "Что-то своё" — проверяем, что поле заполнено
        const customFilled = !selectedActivities.includes('__custom__') || customActivity.trim().length > 0;
        sendBtn.disabled = !(selectedDate && hasActivity && customFilled);
    }

    // --- ДАТА (одиночный выбор) ---
    dateOptions.forEach(btn => {
        btn.addEventListener('click', function() {
            dateOptions.forEach(b => b.classList.remove('selected'));
            this.classList.add('selected');
            selectedDate = this.dataset.value;
            errorNotice.classList.remove('show');
            updateSendButton();
            if (navigator.vibrate) navigator.vibrate(10);
        });
    });

    // --- ДОСУГ (множественный выбор) ---
    activityOptions.forEach(btn => {
        btn.addEventListener('click', function() {
            const value = this.dataset.value;

            if (this.classList.contains('selected')) {
                // Убираем выбор
                this.classList.remove('selected');
                selectedActivities = selectedActivities.filter(v => v !== value);
            } else {
                // Добавляем выбор
                this.classList.add('selected');
                if (!selectedActivities.includes(value)) {
                    selectedActivities.push(value);
                }
            }

            // Показ/скрытие поля ввода для "Что-то своё"
            if (selectedActivities.includes('__custom__')) {
                customInputBlock.classList.add('show');
                setTimeout(() => customInput.focus(), 100);
            } else {
                customInputBlock.classList.remove('show');
            }

            errorNotice.classList.remove('show');
            updateSendButton();
            if (navigator.vibrate) navigator.vibrate(10);
        });
    });

    customInput.addEventListener('input', function() {
        customActivity = this.value;
        updateSendButton();
    });

    // ============================================================
    // ОТПРАВКА В TELEGRAM
    // ============================================================
    const statusDiv = document.getElementById('sendingStatus');

    async function sendToTelegram(date, activities) {
        // Собираем строку с досугом
        const activityList = activities
            .map(v => v === '__custom__' ? `Своё: ${customActivity.trim()}` : v)
            .join(', ');

        const message = `🍂 НОВЫЙ ОТВЕТ! 🍂\n\n📅 Дата: ${date}\n🎯 Досуг: ${activityList}\n\n💕 Согласилась(лся)!`;
        try {
            const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: TELEGRAM_CHAT_ID,
                    text: message
                })
            });
            const data = await response.json();
            return data.ok;
        } catch (e) {
            console.error('Ошибка:', e);
            return false;
        }
    }

    sendBtn.addEventListener('click', async function() {
        if (this.disabled) return;

        // Формируем текст досуга для финального экрана
        const activityList = selectedActivities
            .map(v => v === '__custom__' ? `Своё: ${customActivity.trim()}` : v)
            .join(', ');

        statusDiv.textContent = '⏳ Отправляю...';
        statusDiv.className = 'sending-status show';
        errorNotice.classList.remove('show');
        this.disabled = true;

        const ok = await sendToTelegram(selectedDate, selectedActivities);

        if (ok) {
            statusDiv.textContent = '✅ Отправлено! ❤️';
            statusDiv.className = 'sending-status show success';

            document.getElementById('finalDate').textContent = selectedDate;
            document.getElementById('finalActivity').textContent = activityList;

            setTimeout(function() {
                document.querySelector('.invite-title').style.display = 'none';
                document.querySelector('.invite-sub').style.display = 'none';
                document.querySelectorAll('.question-label').forEach(el => el.style.display = 'none');
                document.querySelectorAll('.options-grid').forEach(el => el.style.display = 'none');
                customInputBlock.style.display = 'none';
                sendBtn.style.display = 'none';
                statusDiv.style.display = 'none';
                errorNotice.style.display = 'none';
                document.getElementById('finalScreen').classList.add('show');
            }, 800);
        } else {
            statusDiv.textContent = '';
            statusDiv.className = 'sending-status';
            errorNotice.classList.add('show');
            this.disabled = false;
        }
    });

    document.getElementById('finalBtn').addEventListener('click', function() {
        alert('🍂 Отлично! Я напишу тебе! ❤️');
    });

    console.log('🍂 Готово!');
</script>

</body>
</html>
